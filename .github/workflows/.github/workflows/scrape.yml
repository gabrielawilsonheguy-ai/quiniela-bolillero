name: Scrape Quiniela

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "30 15 * * *"
    - cron: "30 18 * * *"
    - cron: "30 21 * * *"
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: scraper
        run: npm install --no-audit --no-fund

      - name: Traer resultados
        run: node scraper/scrape.mjs

      - name: Guardar cambios
        run: |
          git config user.name "quiniela-bot"
          git config user.email "quiniela-bot@users.noreply.github.com"
          git add docs/data/resultados.json
          if git diff --staged --quiet; then
            echo "Sin novedades, no hay nada para commitear."
          else
            git commit -m "Resultados $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
