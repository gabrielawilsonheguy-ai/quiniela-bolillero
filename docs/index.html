<style>
  :root{
    --bg:#e9ecef; --bg2:#f3f5f7; --card:#ffffff;
    --line:#dde2e7; --line2:#cbd2d9;
    --ink:#141b22;                /* negro oscuro de los números */
    --tx:#1b2833; --dim:#546472; --mut:#8593a0;
    --amber:#e79a24; --amber-ink:#3a2c10; --amber-deep:#b3760f;
    --shadow:0 1px 2px rgba(20,30,40,.04),0 8px 22px rgba(20,30,40,.06);
    --f-disp:"Space Grotesk",system-ui,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,monospace;
    --f-ui:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(1200px 600px at 78% -8%, #ffffff 0%, transparent 62%), var(--bg);
    color:var(--tx); font-family:var(--f-ui); -webkit-font-smoothing:antialiased; line-height:1.45;
    padding-bottom:48px;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}
  header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),transparent)}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:26px 0 22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .ball{
    width:46px;height:46px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 32% 28%, #ffd67a, var(--amber) 55%, #b97e17);
    color:var(--amber-ink);font-family:var(--f-mono);font-weight:700;font-size:19px;
    display:grid;place-items:center;box-shadow:0 6px 18px rgba(231,154,36,.22), inset 0 -3px 6px rgba(0,0,0,.2);
  }
  .brand h1{font-family:var(--f-disp);font-weight:700;font-size:23px;letter-spacing:-.01em;margin:0;line-height:1.05}
  .brand .sub{color:var(--dim);font-size:12.5px;margin-top:2px}
  .meta{text-align:right;font-size:12.5px;color:var(--mut);font-family:var(--f-mono)}
  .meta b{color:var(--dim);font-weight:600}

  .controls{display:flex;align-items:center;gap:10px;padding:22px 0 4px;flex-wrap:wrap}
  .navbtn{
    width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--card);
    color:var(--dim);font-size:18px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);
  }
  .navbtn:hover{color:var(--tx);border-color:var(--dim)}
  .navbtn:disabled{opacity:.4;cursor:default}
  select{
    appearance:none;background:var(--card);color:var(--tx);border:1px solid var(--line2);border-radius:10px;
    padding:11px 40px 11px 15px;font-family:var(--f-mono);font-size:15px;cursor:pointer;box-shadow:var(--shadow);
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }
  .daylabel{font-family:var(--f-disp);font-weight:600;font-size:15px;color:var(--dim);margin-left:auto}

  .sorteo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
  .sorteo{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}
  .sorteo h3{
    margin:0;padding:11px 13px;font-family:var(--f-disp);font-size:13.5px;font-weight:600;letter-spacing:.03em;
    text-transform:uppercase;color:var(--tx);border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;background:var(--bg2);
  }
  .sorteo h3 .hr{color:var(--mut);font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:0}
  .nums{padding:6px 0}
  .num{display:grid;grid-template-columns:26px 1fr;align-items:center;padding:2.5px 13px;font-family:var(--f-mono);font-size:15.5px}
  .num .pos{color:var(--mut);font-size:11px;text-align:right;padding-right:10px}
  .num .val{letter-spacing:.06em;color:var(--ink)}
  .num.cabeza{background:linear-gradient(90deg,rgba(231,154,36,.13),transparent)}
  .num.cabeza .pos{color:var(--amber-deep);font-weight:600}
  .num.cabeza .val{font-weight:600;font-size:16.5px}
  .sorteo.empty{opacity:.55;display:grid;place-items:center;min-height:130px;color:var(--mut);font-size:12.5px;text-align:center;padding:16px;font-family:var(--f-ui)}

  footer{color:var(--mut);font-size:12px;border-top:1px solid var(--line);margin-top:28px}
  footer .wrap{padding:18px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  footer a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line2)}
  .warn{color:var(--amber-deep)}

  @media (max-width:820px){ .sorteo-grid{grid-template-columns:1fr 1fr} }
  @media (max-width:480px){ .sorteo-grid{grid-template-columns:1fr} .brand h1{font-size:20px} .daylabel{width:100%;margin:6px 0 0} }
  @media (prefers-reduced-motion:no-preference){
    #sorteoGrid{animation:fade .28s ease}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  }
</style>

const ORDER = ["previa","primera","matutina","vespertina","nocturna"];
const LABEL = {previa:"Previa",primera:"Primera",matutina:"Matutina",vespertina:"Vespertina",nocturna:"Nocturna"};
const HORA  = {previa:"10:15",primera:"12:00",matutina:"15:00",vespertina:"18:00",nocturna:"21:00"};
const DIAS  = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

let DB = null, fechas = [];

async function boot(){
  try{
    const r = await fetch("./data/resultados.json",{cache:"no-store"});
    if(!r.ok) throw 0;
    DB = await r.json();
    if(!DB || !DB.sorteos || !Object.keys(DB.sorteos).length) throw 0;
  }catch(e){ DB = SEED; }
  fechas = Object.keys(DB.sorteos).sort().reverse();  // más nueva primero
  initMeta(); initSelect(); render();
}

function fmt(iso){ const [y,m,d]=iso.split("-"); const dt=new Date(+y,+m-1,+d); return {dia:DIAS[dt.getDay()], txt:d+"/"+m+"/"+y}; }

function initMeta(){
  const total = fechas.reduce((a,f)=>a+Object.keys(DB.sorteos[f]).length,0);
  const upd = DB.updated ? new Date(DB.updated) : null;
  document.getElementById("meta").innerHTML =
    "<div><b>"+total+"</b> sorteos · <b>"+fechas.length+"</b> días</div>"+
    (upd?"<div>actualizado "+upd.toLocaleDateString("es-AR")+" "+upd.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})+"</div>":"");
}

function initSelect(){
  const sel = document.getElementById("fecha");
  sel.innerHTML = fechas.map(f=>{ const x=fmt(f); return '<option value="'+f+'">'+x.dia+' '+x.txt+'</option>'; }).join("");
}

function move(step){
  const sel = document.getElementById("fecha");
  const i = sel.selectedIndex + step;
  if(i<0 || i>=fechas.length) return;
  sel.selectedIndex = i; render();
}

function render(){
  const sel = document.getElementById("fecha");
  const f = sel.value || fechas[0];
  const dia = DB.sorteos[f] || {};
  const x = fmt(f);
  document.getElementById("daylabel").textContent = x.dia;
  document.getElementById("prev").disabled = sel.selectedIndex >= fechas.length-1;
  document.getElementById("next").disabled = sel.selectedIndex <= 0;

  document.getElementById("sorteoGrid").innerHTML = ORDER.map(s=>{
    const nums = dia[s];
    if(!nums) return '<div class="sorteo empty">'+LABEL[s]+'<br><span style="font-size:11px">— sin datos —</span></div>';
    const rows = nums.map((n,i)=>
      '<div class="num '+(i===0?'cabeza':'')+'"><span class="pos">'+(i+1)+'º</span><span class="val">'+n+'</span></div>'
    ).join("");
    return '<div class="sorteo"><h3>'+LABEL[s]+' <span class="hr">'+HORA[s]+'</span></h3><div class="nums">'+rows+'</div></div>';
  }).join("");
}

boot();
